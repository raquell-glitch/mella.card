<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raquell Nogueira · Mella Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #8dc63f;
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --dark: #0e0e0e;
  --white: #ffffff;
  --muted: #888;
}
html, body { min-height: 100%; background: var(--dark); }
body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  font-family: "Outfit", sans-serif;
}
.card {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: var(--dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 64px;
  position: relative;
}
.gold-bar {
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
}
.top-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px 0;
}
.logo-main {
  font-family: "Cormorant Garamond", serif;
  font-size: 44px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: -1px;
  line-height: 1;
  animation: fadeDown 0.6s ease both;
}
.logo-agency {
  font-size: 9px;
  letter-spacing: 7px;
  color: rgba(255,255,255,0.5);
  font-weight: 300;
  margin-top: 2px;
  text-transform: uppercase;
  text-align: center;
  animation: fadeDown 0.6s 0.05s ease both;
}
.photo-ring {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  padding: 3px;
  background: conic-gradient(var(--gold), var(--green), var(--gold-light), var(--gold));
  margin: 24px 0 16px;
  animation: fadeUp 0.7s 0.1s ease both;
}
.photo-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--dark);
}
.photo-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 10%;
  display: block;
}
.name {
  font-family: "Cormorant Garamond", serif;
  font-size: 28px;
  font-weight: 600;
  color: var(--white);
  text-align: center;
  letter-spacing: 0.5px;
  animation: fadeUp 0.7s 0.2s ease both;
}
.role {
  font-size: 10px;
  color: var(--gold);
  text-align: center;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-top: 6px;
  font-weight: 400;
  line-height: 1.6;
  animation: fadeUp 0.7s 0.25s ease both;
}
.divider {
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px auto;
  animation: fadeUp 0.7s 0.3s ease both;
}
.contacts {
  width: 100%;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}
.contact-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  border: 0.5px solid rgba(141,198,63,0.12);
  text-decoration: none;
  transition: background 0.2s, border-color 0.2s;
  animation: fadeUp 0.7s ease both;
}
.contact-row:hover {
  background: rgba(141,198,63,0.07);
  border-color: rgba(141,198,63,0.25);
}
.contact-row:nth-child(1) { animation-delay: 0.35s; }
.contact-row:nth-child(2) { animation-delay: 0.40s; }
.contact-row:nth-child(3) { animation-delay: 0.45s; }
.contact-row:nth-child(4) { animation-delay: 0.50s; }
.icon-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ic-green { background: rgba(141,198,63,0.12); }
.ic-gold  { background: rgba(201,168,76,0.12); }
.ic-blue  { background: rgba(10,102,194,0.15); }
.contact-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 1px;
}
.contact-value {
  font-size: 13px;
  color: #ccc;
  font-weight: 400;
}
.save-btn {
  width: calc(100% - 40px);
  padding: 15px;
  border-radius: 10px;
  background: var(--green);
  color: #0e0e0e;
  font-size: 11px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-family: "Outfit", sans-serif;
  margin-bottom: 16px;
  transition: background 0.2s, transform 0.1s;
  animation: fadeUp 0.7s 0.55s ease both;
}
.save-btn:hover { background: #9fd44a; }
.save-btn:active { transform: scale(0.98); }
.site-link {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  animation: fadeUp 0.7s 0.6s ease both;
}
.site-link span { color: var(--green); }
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (max-width: 420px) { .card { max-width: 100%; } }
</style>
</head>
